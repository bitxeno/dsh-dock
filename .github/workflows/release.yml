name: Release

# 推 v* 标签自动构建打包发布；也可在 Actions 页手动触发（生成 dev 版本号）。
# 产物：通用二进制 DMG + SHA256 校验和 + Homebrew cask 文件（附在 Release 里）。
#
# Release notes 顺序（同 simlet-cli）：changelogithub 自上个 tag 起的
# conventional commits 分组打头 → 安装块附后 → GitHub 自动生成的
# What's Changed 垫底（指定 body 时 API 会把 body 前置到自动 notes 之前，
# 所以 softprops 那里不能再设 append_body: true）。
# changelogithub 是 node 工具，macos runner 自带 node，直接 npx 拉起即可。
#
# 可选：配置 secrets HOMEBREW_TAP_REPO（如 bitxeno/homebrew-tap）与
# HOMEBREW_TAP_TOKEN（对该 tap 仓库有 contents:write 的 PAT），会自动把
# cask 推到 tap 仓库，用户即可 `brew install --cask bitxeno/tap/dshdock`。
#
# 注意 `"on":` 加引号是刻意的：YAML 1.1 会把裸 `on` 解析成布尔 true，工具回写
# 文件时容易把它改写成 `true:`，那样 push tag 就再也不会触发了。
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changelogithub 要读上个 tag 起的完整历史，浅克隆会断代。
          fetch-depth: 0

      - name: Derive version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (universal, ad-hoc signed)
        run: |
          set -euo pipefail
          # 无证书环境用 ad-hoc 签名；发布说明里写明首次启动需右键打开或 xattr
          # 去隔离。配好 Developer ID 证书后可加公证（那时再开 hardened runtime）。
          # 刻意 ENABLE_HARDENED_RUNTIME=NO：实测 hardened runtime 下（继承给
          # node 子进程）从外置卷加载 dylib 会被沙盒 EPERM 拦截
          # （dyld: file system sandbox blocked open，libnode 起不来），
          # 而未公证分发本来就用不上它的任何好处。
          xcodebuild \
            -project DshDock.xcodeproj \
            -scheme DshDock \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$VERSION \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          # 版本已在构建期经 MARKETING_VERSION 注入 Info.plist 并随签名封存；
          # 严禁签名后用 PlistBuddy 改 Info.plist（破坏签名 → 子进程被沙盒拦截，实测）。
          APP="build/Build/Products/Release/DshDock.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          hdiutil create -volname "DshDock $VERSION" \
            -srcfolder "$APP" -ov -format UDZO \
            "dist/DshDock-$VERSION.dmg"

      - name: Checksums and Homebrew cask
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "DshDock-$VERSION.dmg" > checksums.txt
          SHA=$(shasum -a 256 "DshDock-$VERSION.dmg" | awk '{print $1}')
          cat > dshdock.rb <<RUBY
          # typed: strict
          # frozen_string_literal: true

          cask "dshdock" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/DshDock-$VERSION.dmg"
            name "DshDock"
            desc "Desktop shell hosting managed dsh web"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            app "DshDock.app"

            # 构建未公证（ad-hoc 签名）：装完立即去隔离，免掉首启的 Gatekeeper 拦截。
            # 直接从 Release 下载 DMG 的用户不走这条路径，caveats 里保留手动方法。
            # 新 install-steps DSL 的坑（全部实测）：路径要用 {{appdir}} 模板标记
            # （Ruby 插值 #{appdir} 在块内未定义、相对路径不锚定 base、cop 只认
            # 纯字符串参数），块内只允许 run 等步骤调用。
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/DshDock.app"]
            end

            caveats <<~EOS
              直接下载 DMG 安装（不经 Homebrew）时，构建未做公证（ad-hoc 签名），
              首次启动若被 Gatekeeper 拦截：右键 App 选"打开"，或执行
                xattr -dr com.apple.quarantine /Applications/DshDock.app
            EOS
          end
          RUBY
          ruby -c dshdock.rb

      # Release notes 由 changelogithub 从 conventional commits 生成
      #（与 simlet-cli 同款；from 指向上个 tag，首版无 tag 时全量生成；
      # 默认类型配置会略过 docs/ci/chore/test）。
      - name: Generate the release notes with changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            npx --yes changelogithub --output "$RUNNER_TEMP/CHANGELOG.md"
          else
            npx --yes changelogithub --from "$PREV" --output "$RUNNER_TEMP/CHANGELOG.md"
          fi
          cat "$RUNNER_TEMP/CHANGELOG.md"

      # 安装块附在 changelog 之后：changelogithub 注记打头讲本版变化，
      # 安装说明垫底方便跟着装；What's Changed 由 softprops 的
      # generate_release_notes 追加在最后。
      - name: Append install instructions
        run: |
          {
            cat "$RUNNER_TEMP/CHANGELOG.md"
            echo ""
            echo ""
            echo "## 安装"
            echo ""
            echo '```bash'
            echo "brew install --cask bitxeno/tap/dshdock"
            echo '```'
            echo ""
            echo "升级："
            echo ""
            echo '```bash'
            echo "brew upgrade --cask dshdock"
            echo '```'
            echo ""
            echo "也可以直接下载下面的 \`DshDock-$VERSION.dmg\`，挂载后把"
            echo "\`DshDock.app\` 拖进 \`/Applications\`。构建未做公证（ad-hoc 签名），"
            echo "首次启动若被 Gatekeeper 拦截：右键 App 选“打开”，或执行"
            echo '  xattr -dr com.apple.quarantine /Applications/DshDock.app'
            echo "（经 Homebrew 安装会自动去隔离）。"
          } > "$RUNNER_TEMP/NOTES.md"

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ${{ runner.temp }}/NOTES.md
          files: |
            dist/DshDock-${{ env.VERSION }}.dmg
            dist/checksums.txt
            dist/dshdock.rb

      - name: Push cask to Homebrew tap
        env:
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        # 未配置 secrets 时优雅跳过：cask 已附在 Release 资产里，可手动拷进 tap。
        if: env.TAP_REPO != '' && env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          # 走 Contents API 而不是 git push：git 凭据对 OAuth token 认证形式挑剔
          # （x-access-token:/裸 token/username:token 三种形式实测两种被拒），
          # API 的 Bearer 认证 + 失败时打印原始响应，行为可诊断。
          API="https://api.github.com/repos/${TAP_REPO}/contents/Casks/dshdock.rb"
          OLD_SHA=$(curl -sf -H "Authorization: Bearer ${TAP_TOKEN}" "$API" | jq -r '.sha // empty') || true
          jq -n --arg message "dshdock ${VERSION}" \
                --arg content "$(base64 -i dist/dshdock.rb)" \
                --arg sha "$OLD_SHA" \
                '{message: $message, content: $content}
                 + (if $sha == "" then {} else {sha: $sha} end)' > payload.json
          HTTP=$(curl -s -o response.json -w "%{http_code}" \
            -X PUT -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" -d @payload.json)
          echo "tap update HTTP ${HTTP}"
          cat response.json | jq -r '.commit.html_url // .message'
          case "$HTTP" in 200|201) exit 0;; *) exit 1;; esac
